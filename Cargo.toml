[package]
name = "comtap"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "Bridge TCP devices to virtual serial (COM) ports, as a self-healing service for Windows and Linux."
repository = "https://github.com/jackbrumley/comtap"
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
serialport = "4.7"
windows-service = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
